<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shutter1" x1="12" y1="8" x2="28" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shutter2" x1="40" y1="12" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shutter3" x1="36" y1="40" x2="20" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shutter4" x1="8" y1="36" x2="24" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="apertureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark container badge with sleek border -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="13" fill="#090d16" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Outer lens accent circle -->
  <circle cx="24" cy="24" r="17.5" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Interlocking Camera Shutter Blades -->
  <!-- Blade 1: Top -->
  <path d="M14 9H31L26.5 21.5L14 9Z" fill="url(#shutter1)" />
  <!-- Blade 2: Right -->
  <path d="M39 14V31L26.5 26.5L39 14Z" fill="url(#shutter2)" />
  <!-- Blade 3: Bottom -->
  <path d="M34 39H17L21.5 26.5L34 39Z" fill="url(#shutter3)" />
  <!-- Blade 4: Left -->
  <path d="M9 34V17L21.5 21.5L9 34Z" fill="url(#shutter4)" />

  <!-- Center Optical Prism Core -->
  <polygon points="24,19 29,24 24,29 19,24" fill="#ffffff" filter="url(#apertureGlow)"/>
  <circle cx="24" cy="24" r="2.2" fill="#0284c7"/>
</svg>
